# Despliegue en Cloudflare como Worker con «Static Assets».
# Cloudflare sirve directamente la web estática generada en `dist/`. El único
# código propio es src/worker.mjs, que solo atiende las direcciones /api/
# (la comprobación de palabras del juego); el resto no pasa por él.
#
#   npm run build     genera dist/
#   npm run preview   la sirve en local exactamente como lo hará Cloudflare
#   npm run deploy    genera dist/ y la publica
#
# Cabeceras (caché y seguridad): las escribe build.mjs en dist/_headers.

name = "tradissea-web"
main = "src/worker.mjs"
compatibility_date = "2025-06-01"

[assets]
directory = "./dist"
binding = "ASSETS"

# Solo estas direcciones pasan por src/worker.mjs.
run_worker_first = ["/api/*"]

# Si la dirección no existe, se devuelve el 404.html más cercano (el del
# idioma: /es/404.html para /es/loquesea) con su diseño, en vez de la página
# de error genérica de Cloudflare.
not_found_handling = "404-page"

# `wrangler deploy` y `wrangler dev` generan la web antes de subirla.
[build]
command = "node build.mjs"
